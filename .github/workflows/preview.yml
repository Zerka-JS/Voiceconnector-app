# Aperçu rapide de l'interface : l'auto-test de VoiceConnector rend la console, le Studio et les
# fenêtres dans Qt « hors écran » sur Linux (deux minutes, sans construire l'exe), puis publie les
# captures dans la release « preview-<branche> ». Le vrai build Windows reste dans build-windows.yml.
name: Aperçu

on:
  push:
    paths:
      - "voiceconnector/**"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apercu:
    name: Captures hors écran
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceconnector
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances système (Qt hors écran)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt
      - name: Auto-test et captures (mode A, mode B)
        env:
          APPDATA: ${{ runner.temp }}/appdata
        run: |
          mkdir -p preview/modeb
          python main.py --selftest preview/console.png 2>&1 | tail -40 || true
          python main.py --mode b --selftest preview/modeb/console.png 2>&1 | tail -40 || true
          ls -la preview preview/modeb
          cat preview/console.txt || true
      - name: Diagnostic - sortie propre de chaque fichier de tests Qt
        env:
          APPDATA: ${{ runner.temp }}/appdata_diag
        run: |
          python -m pip install -q pytest
          mkdir -p "$APPDATA"
          for t in tests/test_studio_widgets.py tests/test_studio_ui.py tests/test_ui.py tests/test_hardware_ui.py tests/test_modes_ui.py tests/test_colors_ui.py; do
            name=$(basename "$t" .py)
            set +e
            VC_NO_QT_TEARDOWN=1 python -X faulthandler -m pytest -q -p no:cacheprovider "$t" > diag_raw.txt 2>&1
            raw=$?
            python -X faulthandler -m pytest -q -p no:cacheprovider "$t" > diag.txt 2>&1
            code=$?
            set -e
            echo "::notice title=diag_$name::sans_nettoyage=$raw avec_nettoyage=$code | $(tail -3 diag_raw.txt | tr '\n' ' ' | tr -d '%') | $(tail -3 diag.txt | tr '\n' ' ' | tr -d '%')"
          done
      - name: Publier les captures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          shopt -s nullglob
          cd preview
          for f in modeb/*; do cp "$f" "modeb_$(basename "$f")"; done
          zip -q ../selftest.zip *.png *.txt
          cd ..
          tag="preview-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" selftest.zip preview/console.png preview/console.txt \
            --prerelease --target "$GITHUB_SHA" \
            --title "Aperçu de l'interface ($GITHUB_REF_NAME)" \
            --notes "Captures de l'auto-test (Qt hors écran, Linux) faites depuis $GITHUB_SHA. selftest.zip : toutes les captures."
