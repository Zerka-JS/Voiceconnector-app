# Construit « VoiceConnector.exe » sur une machine Windows de GitHub à chaque push,
# après les tests, et le publie dans une release téléchargeable.
name: Build Windows

on:
  push:
    paths:
      - "voiceconnector/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux, pont Lua inclus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceconnector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances système (Qt hors écran, Lua 5.4)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build-windows:
    name: Tests + build de l'exe (Windows)
    needs: tests-linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voiceconnector
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests (dont masquage de fenêtres Win32)
        run: |
          set -o pipefail
          python -m pytest -q -ra --tb=short tests 2>&1 | tee pytest.log
      - name: Détail des tests en échec (annotations)
        if: failure()
        run: |
          python - <<'PY'
          # Les journaux bruts ne se lisent que sur le site GitHub : on remonte aussi les
          # échecs sous forme d'annotations, visibles dans le résumé de l'exécution et par l'API.
          import pathlib, re
          log = pathlib.Path("pytest.log").read_text(encoding="utf-8", errors="replace")
          def annotate(title, text):
              text = text.strip()[:3500]
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{text}")
          head, _, summary = log.partition("short test summary info")
          annotate("Resume pytest", summary or log[-3000:])
          parts = re.split(r"^_{3,} (.+?) _{3,}$", head, flags=re.M)
          for name, body in list(zip(parts[1::2], parts[2::2]))[:8]:
              tail = "\n".join(body.strip().splitlines()[-9:])
              annotate("Echec " + re.sub(r"[^\w.\[\]-]", "_", name)[:60], name + "\n" + tail)
          PY
      - name: Infos du build (mises à jour automatiques)
        run: |
          python - <<'PY'
          import json, os, re
          source = open("core/config.py", encoding="utf-8").read()
          version = re.search(r'^APP_VERSION = "([^"]+)"', source, re.M).group(1)
          # Canal commun à toutes les branches : un exe voit tout build plus récent,
          # quelle que soit la branche qui l'a produit
          info = {"version": version, "build": int(os.environ["GITHUB_RUN_NUMBER"]),
                  "commit": os.environ["GITHUB_SHA"], "repo": os.environ["GITHUB_REPOSITORY"],
                  "tag": "build-latest"}
          json.dump(info, open("build_info.json", "w", encoding="utf-8"), indent=2)
          print(info)
          PY
      - name: Build PyInstaller
        run: python -m PyInstaller --noconfirm --clean build.spec
      - name: Propriétés de l'exe (version, développeurs)
        shell: pwsh
        run: |
          $info = (Get-Item dist/VoiceConnector.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, CompanyName, LegalCopyright
          if ($info.CompanyName -ne "Zerka") { throw "Crédits absents de VoiceConnector.exe" }
      - name: Auto-test de l'exe (rendu de la console en mode démo)
        env:
          APPDATA: ${{ runner.temp }}/appdata
        run: |
          mkdir -p selftest
          ./dist/VoiceConnector.exe --selftest selftest/console.png
          cat selftest/console.txt
          grep -q "RÉSULTAT : OK" selftest/console.txt
          ls -la dist selftest
      - name: Description de la mise à jour (version.json)
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, subprocess
          info = json.load(open("build_info.json", encoding="utf-8"))
          data = open("dist/VoiceConnector.exe", "rb").read()
          info.update(
              sha256=hashlib.sha256(data).hexdigest(), size=len(data),
              notes=subprocess.check_output(["git", "log", "-1", "--format=%s"],
                                            encoding="utf-8").strip(),   # git écrit en UTF-8
              published=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"))
          # Un version.json par release, chacun pointant vers l'exe de SA release :
          # « build-latest » (commune) et « build-<branche> » (lue par les anciens exe)
          branch_tag = "build-" + os.environ["GITHUB_REF_NAME"].replace("/", "-")
          for folder, tag in (("dist", info["tag"]), ("dist/branch", branch_tag)):
              os.makedirs(folder, exist_ok=True)
              out = dict(info, url=f"https://github.com/{info['repo']}/releases/download/{tag}/VoiceConnector.exe")
              json.dump(out, open(f"{folder}/version.json", "w", encoding="utf-8"),
                        ensure_ascii=False, indent=2)
              print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceConnector
          path: |
            voiceconnector/dist/VoiceConnector.exe
            voiceconnector/dist/version.json
            voiceconnector/selftest/
      - name: Release « build-<branche> »
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/VoiceConnector.exe dist/branch/version.json selftest/console.png \
            --prerelease --target "$GITHUB_SHA" \
            --title "VoiceConnector — dernier build ($GITHUB_REF_NAME)" \
            --notes "Exécutable Windows construit automatiquement depuis $GITHUB_SHA.

          Télécharge **VoiceConnector.exe** et lance-le. Il faut Voicemeeter (Potato ou Banana) et REAPER installés.
          VoiceConnector est développé par Zerka.
          Pour voir la console sans eux : \`VoiceConnector.exe --demo\`.
          console.png : rendu de l'auto-test fait par ce build."
      - name: Release commune « build-latest » (mises à jour de tous les exe)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un build d'une autre branche plus récent est déjà publié : on le garde
          mkdir -p latest
          if gh release download build-latest -p version.json -D latest 2>/dev/null; then
            online=$(python -c "import json; print(json.load(open('latest/version.json'))['build'])")
            if [ "$online" -gt "$GITHUB_RUN_NUMBER" ]; then
              echo "build-latest contient déjà le build $online : rien à publier"; exit 0
            fi
          fi
          gh release delete build-latest --yes --cleanup-tag || true
          gh release create build-latest dist/VoiceConnector.exe dist/version.json selftest/console.png \
            --prerelease --target "$GITHUB_SHA" \
            --title "VoiceConnector — dernier build (toutes branches)" \
            --notes "Dernier exe construit ($GITHUB_REF_NAME, $GITHUB_SHA). VoiceConnector s'y met à jour automatiquement."
          # Anciens exe (qui consultent encore build-<autre branche>) : leur
          # version.json annonce aussi ce build, téléchargé depuis build-latest
          own="build-${GITHUB_REF_NAME//\//-}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in build-latest|"$own") continue ;; build-*) ;; *) continue ;; esac
            gh release upload "$tag" dist/version.json --clobber || echo "version.json non mis à jour : $tag"
          done
